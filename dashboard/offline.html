<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f14" />
    <title>OA Orchestrator — Offline</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0f14; color: #f4f7fb; }
      main { width: min(32rem, calc(100% - 2rem)); padding: 2rem; border: 1px solid #27303b; border-radius: 1rem; background: #121821; box-sizing: border-box; }
      .mark { width: 3rem; height: 3rem; display: grid; place-items: center; border-radius: .8rem; background: #d7ff4f; color: #0b0f14; font-weight: 800; }
      h1 { margin: 1.25rem 0 .75rem; font-size: 1.6rem; }
      p { margin: 0; color: #aab5c3; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">OA</div>
      <h1>Orchestrator is unavailable offline</h1>
      <p>Operational data is intentionally not cached. Reconnect to the internet and reopen the app to load current tasks, costs, and controls.</p>
    </main>
  </body>
</html>
